[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instantmesh"
version = "0.0.1"
requires-python = ">=3.10"
description = "InstantMesh dependencies based on official Jupyter Notebook"
dependencies = [
]

# Tự động tìm code trong thư mục (để import src.utils...)
[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["assets*", "examples*", "outputs*"]
