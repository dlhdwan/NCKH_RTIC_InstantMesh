[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instantmesh"
version = "0.0.1"
requires-python = ">=3.10"
description = "InstantMesh dependencies based on official Jupyter Notebook"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["assets*", "examples*", "outputs*"]


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"" = ["configs/*.yaml"]
